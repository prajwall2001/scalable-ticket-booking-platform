server:
  port: 8083
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_bookings?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
